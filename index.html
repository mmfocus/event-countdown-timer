<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MMF Timer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='90' fill='%23000'/%3E%3Ctext x='256' y='225' text-anchor='middle' font-family='Arial,sans-serif' font-size='120' font-weight='800' fill='%23fff'%3EMMF%3C/text%3E%3Ctext x='256' y='350' text-anchor='middle' font-family='Arial,sans-serif' font-size='78' font-weight='800' fill='%23fff'%3ETIMER%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;padding:24px}
.app{max-width:1200px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.title{font-size:20px;font-weight:800;letter-spacing:2px}.status{font-size:16px;font-weight:700;margin-top:8px}.adjust{display:flex;gap:10px}
.btn{background:#050505;color:#fff;border:2px solid #aaa;border-radius:14px;padding:13px 22px;font-size:17px;font-weight:700;cursor:pointer}
.display{width:100%;height:300px;border:2px solid #777;border-radius:22px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:18px}
.displayInner{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.timer{font-size:clamp(100px,16vw,210px);font-weight:800;letter-spacing:-6px;line-height:.85;white-space:nowrap}
.message{display:none;width:100%;height:100%;padding:10px;align-items:center;justify-content:center;font-weight:800;line-height:.9;overflow:hidden}
.messageLines{width:100%;text-align:center}.messageLines div{white-space:nowrap}
.minutes{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:12px}.minutes .btn{padding:14px 8px}
.mainControls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.mainControls .btn{height:58px;font-size:18px}
.presentation{width:100%;margin-bottom:22px;height:58px}.custom{border-top:1px solid #444;padding-top:15px}
.customHeader{font-size:18px;font-weight:800;margin-bottom:15px;cursor:pointer}.customBody{display:block;border:1px solid #444;border-radius:18px;padding:18px}
.settings{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:20px}
.field label{display:block;font-size:14px;margin-bottom:7px}.field input[type=number]{width:100%;padding:12px;background:#050505;color:#fff;border:2px solid #777;border-radius:10px;font-size:18px}
.field input[type=color]{width:58px;height:44px;background:#050505;border:2px solid #777;border-radius:10px}
.speaker label{display:block;font-size:15px;margin-bottom:8px}.speakerRow{display:grid;grid-template-columns:1fr auto auto;gap:10px}
.speakerRow input{width:100%;padding:14px;background:#050505;color:#fff;border:2px solid #777;border-radius:10px;font-size:16px}
@media(max-width:700px){body{padding:14px}.title{font-size:15px}.adjust .btn{padding:10px 13px;font-size:14px}.display{height:220px}
.minutes{grid-template-columns:repeat(5,1fr);gap:6px}.minutes .btn{font-size:14px;padding:12px 3px}.settings{grid-template-columns:1fr 1fr}
.speakerRow{grid-template-columns:1fr 1fr}.speakerRow input{grid-column:1/-1}.timer{letter-spacing:-4px}}
</style></head>
<body><div class="app">
<div class="top"><div><div class="title">EVENT COUNTDOWN</div><div id="status" class="status">READY</div></div>
<div class="adjust"><button class="btn" id="minus">−30s</button><button class="btn" id="plus">+30s</button></div></div>
<div class="display"><div class="displayInner"><div id="timer" class="timer">10:00</div>
<div id="message" class="message"><div id="messageLines" class="messageLines"></div></div></div></div>
<div class="minutes">
<button class="btn" data-min="5">5 M</button><button class="btn" data-min="10">10 M</button><button class="btn" data-min="15">15 M</button><button class="btn" data-min="20">20 M</button><button class="btn" data-min="30">30 M</button>
<button class="btn" data-min="40">40 M</button><button class="btn" data-min="50">50 M</button><button class="btn" data-min="60">60 M</button><button class="btn" data-min="90">90 M</button><button class="btn" id="tod">TIME OF DAY</button>
</div>
<div class="mainControls"><button class="btn" id="start">START</button><button class="btn" id="reset">RESET</button></div>
<button class="btn presentation" id="presentation">PRESENTATION MODE</button>
<div class="custom"><div class="customHeader" id="customHeader">▼ Customize Timer</div><div class="customBody" id="customBody">
<div class="settings"><div class="field"><label>Set Minutes</label><input id="customMinutes" type="number" min="1" value="10"></div>
<div class="field"><label>Background Color</label><input id="bg" type="color" value="#000000"></div>
<div class="field"><label>Text Color</label><input id="fg" type="color" value="#ffffff"></div></div>
<div class="speaker"><label>Speaker Message</label><div class="speakerRow">
<input id="speakerInput" type="text" placeholder="Type your message here..."><button class="btn" id="show">SHOW</button><button class="btn" id="hide">HIDE</button>
</div></div></div></div></div>
<script>
let remaining=600,running=false,interval=null,timeOfDay=false,messageVisible=false;
const timer=document.getElementById('timer'),message=document.getElementById('message'),lines=document.getElementById('messageLines'),display=document.querySelector('.display'),status=document.getElementById('status'),start=document.getElementById('start');
function format(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function render(){if(timeOfDay){const d=new Date();timer.textContent=String(d.getHours()%12||12).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}else timer.textContent=format(remaining)}
function measure(t,size){const c=document.createElement('canvas'),x=c.getContext('2d');x.font='800 '+size+'px Arial';return x.measureText(t).width}
function fitMessage(){
 const width=display.clientWidth-20,height=display.clientHeight-20,words=document.getElementById('speakerInput').value.trim().split(/\s+/);let best=null;
 for(let size=200;size>=10;size--){let arr=[],line='';for(const word of words){const test=line?line+' '+word:word;if(measure(test,size)<=width)line=test;else{if(line)arr.push(line);line=word}}if(line)arr.push(line);
 if(arr.every(x=>measure(x,size)<=width)&&arr.length*size*.9<=height){best={size,arr};break}}
 if(!best){let size=10,arr=[],line='';for(const word of words){const test=line?line+' '+word:word;if(measure(test,size)<=width)line=test;else{if(line)arr.push(line);line=word}}if(line)arr.push(line);best={size,arr}}
 lines.innerHTML=best.arr.map(x=>'<div>'+x.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>').join('');
 lines.style.fontSize=best.size+'px';
}
function tick(){if(!running||timeOfDay)return;remaining=Math.max(0,remaining-1);if(remaining===0){running=false;clearInterval(interval);interval=null;start.textContent='START';status.textContent='TIME'}if(!messageVisible)render()}
start.onclick=()=>{if(timeOfDay)return;if(running){running=false;clearInterval(interval);interval=null;start.textContent='START';status.textContent='PAUSED'}else{if(remaining===0)remaining=600;running=true;start.textContent='PAUSE';status.textContent='RUNNING';clearInterval(interval);interval=setInterval(tick,1000)}};
reset.onclick=()=>{running=false;clearInterval(interval);interval=null;remaining=600;timeOfDay=false;messageVisible=false;message.style.display='none';timer.style.display='block';start.textContent='START';status.textContent='READY';render()};
plus.onclick=()=>{if(!timeOfDay){remaining+=30;if(!messageVisible)render()}};
minus.onclick=()=>{if(!timeOfDay){remaining=Math.max(0,remaining-30);if(remaining===0){running=false;clearInterval(interval);interval=null;start.textContent='START';status.textContent='TIME'}if(!messageVisible)render()}};
document.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>{remaining=Number(b.dataset.min)*60;running=false;clearInterval(interval);interval=null;timeOfDay=false;messageVisible=false;message.style.display='none';timer.style.display='block';start.textContent='START';status.textContent='READY';render()});
tod.onclick=()=>{timeOfDay=true;running=false;clearInterval(interval);interval=null;messageVisible=false;message.style.display='none';timer.style.display='block';start.textContent='START';status.textContent='TIME OF DAY';render()};
document.getElementById('show').onclick=()=>{if(!speakerInput.value.trim())return;messageVisible=true;timer.style.display='none';message.style.display='flex';fitMessage();status.textContent='MESSAGE'};
document.getElementById('hide').onclick=()=>{messageVisible=false;message.style.display='none';timer.style.display='block';status.textContent=running?'RUNNING':(remaining===0?'TIME':'PAUSED');render()};
customHeader.onclick=()=>{const b=document.getElementById('customBody');b.style.display=b.style.display==='none'?'block':'none';customHeader.textContent=b.style.display==='none'?'▶ Customize Timer':'▼ Customize Timer'};
customMinutes.onchange=()=>{remaining=Math.max(1,Number(customMinutes.value)||10)*60;running=false;clearInterval(interval);interval=null;start.textContent='START';status.textContent='READY';render()};
bg.oninput=()=>{document.body.style.background=bg.value;display.style.background=bg.value};
fg.oninput=()=>{document.body.style.color=fg.value;timer.style.color=fg.value;message.style.color=fg.value};
presentation.onclick=()=>{if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen()};
window.addEventListener('resize',()=>{if(messageVisible)fitMessage()});render();
</script></body></html>
