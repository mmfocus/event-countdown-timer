<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MMF Timer</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;touch-action:pan-x pan-y pinch-zoom}
body{padding:8px 12px}
.app{width:100%;max-width:1200px;height:100%;margin:auto}
.top{height:74px;display:flex;justify-content:space-between;align-items:flex-start}
.brandMMF{font-family:Arial Black,Arial,sans-serif;font-size:34px;font-weight:900;line-height:.8;letter-spacing:-2px}
.brandTimer{font-family:Arial Black,Arial,sans-serif;font-size:16px;font-weight:900;letter-spacing:5px;margin-top:4px;line-height:.8}
.brandCompany{font-family:Arial Black,Arial,sans-serif;font-size:11px;font-weight:900;letter-spacing:1.4px;margin-top:7px}
.adjust{display:flex;gap:12px}
.btn{appearance:none;-webkit-appearance:none;background:#050505;color:#fff;border:2px solid #ddd;border-radius:14px;font-family:Arial Black,Arial,sans-serif;font-weight:900;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.btn:active{transform:scale(.98)}
.adjust .btn{width:92px;height:56px;font-size:18px}
.display{height:310px;width:100%;border:2px solid #ddd;border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000;margin-bottom:10px}
.timer{font-family:Arial Black,Arial,sans-serif;font-weight:900;font-size:clamp(115px,16vw,230px);line-height:.8;letter-spacing:-7px;white-space:nowrap;color:#fff}
.message{display:none;width:100%;height:100%;padding:5px;align-items:center;justify-content:center;overflow:hidden}
.messageLines{width:100%;text-align:center;font-family:Arial Black,Arial,sans-serif;font-weight:900;line-height:.9}
.messageLines div{white-space:nowrap}
.minutes{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:8px}
.minutes .btn{height:48px;font-size:17px}
.mainControls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.mainControls .btn{height:64px;font-size:27px}
#start{border:4px solid #00e84f;background:#003d16}
#reset{border:4px solid #ff2028;background:#400000}
.custom{border-top:1px solid #777;padding-top:6px}
.customHeader{font-size:16px;font-weight:900;margin-bottom:6px;cursor:pointer}
.customBody{border:2px solid #555;border-radius:13px;padding:10px}
.settings{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;margin-bottom:9px}
.field label,.speaker label{display:block;font-size:13px;font-weight:900;margin-bottom:3px}
.field input[type=number]{width:100%;padding:8px;background:#050505;color:#fff;border:2px solid #777;border-radius:10px;font-size:16px}
.field input[type=color]{width:48px;height:38px;background:#050505;border:2px solid #777;border-radius:10px}
.speakerRow{display:grid;grid-template-columns:1fr auto auto;gap:8px}
.speakerRow input{width:100%;padding:9px;background:#050505;color:#fff;border:2px solid #777;border-radius:10px;font-size:15px}
.speakerRow .btn{min-width:90px;height:42px;font-size:15px}
.status{display:none!important}
@media(max-width:700px) and (orientation:landscape){
 body{padding:6px 10px}
 .top{height:62px}
 .brandMMF{font-size:25px}.brandTimer{font-size:12px;letter-spacing:4px}.brandCompany{font-size:9px;letter-spacing:1px}
 .adjust{gap:7px}.adjust .btn{width:72px;height:44px;font-size:14px}
 .display{height:250px}.timer{font-size:clamp(95px,15vw,200px)}
 .minutes{gap:5px}.minutes .btn{height:42px;font-size:14px}
 .mainControls .btn{height:52px;font-size:21px}
 .customBody{padding:7px}.field label,.speaker label{font-size:11px}.speakerRow input{font-size:13px}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div>
      <div class="brandMMF">MMF</div>
      <div class="brandTimer">TIMER</div>
      <div class="brandCompany">MULTIMEDIA FOCUS LLC</div>
      <div id="status" class="status">READY</div>
    </div>
    <div class="adjust">
      <button type="button" class="btn" id="minus1">−1M</button>
      <button type="button" class="btn" id="minus30">−30s</button>
      <button type="button" class="btn" id="plus30">+30s</button>
      <button type="button" class="btn" id="plus1">+1M</button>
    </div>
  </div>

  <div class="display" id="display">
    <div id="timer" class="timer">00:00</div>
    <div id="message" class="message"><div id="messageLines" class="messageLines"></div></div>
  </div>

  <div class="minutes">
    <button type="button" class="btn preset" data-min="5">5 M</button>
    <button type="button" class="btn preset" data-min="10">10 M</button>
    <button type="button" class="btn preset" data-min="15">15 M</button>
    <button type="button" class="btn preset" data-min="20">20 M</button>
    <button type="button" class="btn preset" data-min="30">30 M</button>
    <button type="button" class="btn preset" data-min="40">40 M</button>
    <button type="button" class="btn preset" data-min="50">50 M</button>
    <button type="button" class="btn preset" data-min="60">60 M</button>
    <button type="button" class="btn preset" data-min="90">90 M</button>
    <button type="button" class="btn" id="timeOfDay">TIME OF DAY</button>
  </div>

  <div class="mainControls">
    <button type="button" class="btn" id="start">START</button>
    <button type="button" class="btn" id="reset">RESET</button>
  </div>

  <div class="custom">
    <div class="customHeader" id="customHeader">▼ Customize Timer</div>
    <div class="customBody" id="customBody">
      <div class="settings">
        <div class="field">
          <label>Set Minutes</label>
          <input id="customMinutes" type="number" min="1" step="1" placeholder="Minutes">
        </div>
        <div class="field">
          <label>Background Color</label>
          <input id="bg" type="color" value="#000000">
        </div>
        <div class="field">
          <label>Text Color</label>
          <input id="fg" type="color" value="#ffffff">
        </div>
      </div>
      <div class="speaker">
        <label>Speaker Message</label>
        <div class="speakerRow">
          <input id="speakerInput" type="text" placeholder="Type your message here...">
          <button type="button" class="btn" id="show">SHOW</button>
          <button type="button" class="btn" id="hide">HIDE</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

var remaining = 0;
var resetDuration = 0;
var running = false;
var timeOfDay = false;
var messageVisible = false;
var intervalId = null;

var timer = document.getElementById('timer');
var display = document.getElementById('display');
var message = document.getElementById('message');
var messageLines = document.getElementById('messageLines');
var status = document.getElementById('status');
var start = document.getElementById('start');
var reset = document.getElementById('reset');
var minus1 = document.getElementById('minus1');
var minus30 = document.getElementById('minus30');
var plus30 = document.getElementById('plus30');
var plus1 = document.getElementById('plus1');
var timeOfDayButton = document.getElementById('timeOfDay');
var customMinutes = document.getElementById('customMinutes');
var speakerInput = document.getElementById('speakerInput');
var bg = document.getElementById('bg');
var fg = document.getElementById('fg');
var showButton = document.getElementById('show');
var hideButton = document.getElementById('hide');
var customHeader = document.getElementById('customHeader');
var customBody = document.getElementById('customBody');

function formatTime(seconds){
  seconds = Math.max(0, Math.floor(seconds));
  var m = Math.floor(seconds / 60);
  var s = seconds % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function render(){
  if(timeOfDay){
    var d = new Date();
    var h = d.getHours() % 12 || 12;
    timer.textContent = String(h).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }else{
    timer.textContent = formatTime(remaining);
  }
}

function stopTimer(){
  running = false;
  if(intervalId !== null){
    clearInterval(intervalId);
    intervalId = null;
  }
  start.textContent = 'START';
}

function tick(){
  if(!running || timeOfDay) return;
  remaining = Math.max(0, remaining - 1);
  if(remaining === 0){
    stopTimer();
  }
  if(!messageVisible) render();
}

function startOrPause(){
  if(timeOfDay) return;
  if(running){
    stopTimer();
    status.textContent = 'PAUSED';
    return;
  }
  if(remaining <= 0) return;
  running = true;
  start.textContent = 'PAUSE';
  status.textContent = 'RUNNING';
  if(intervalId !== null) clearInterval(intervalId);
  intervalId = setInterval(tick,1000);
}

function setDuration(seconds){
  stopTimer();
  remaining = Math.max(0, Math.floor(seconds));
  resetDuration = remaining;
  timeOfDay = false;
  messageVisible = false;
  message.style.display = 'none';
  timer.style.display = 'block';
  start.textContent = 'START';
  status.textContent = 'READY';
  render();
}

function adjust(seconds){
  if(timeOfDay) return;
  remaining = Math.max(0, remaining + seconds);
  if(remaining === 0) stopTimer();
  if(!messageVisible) render();
}

function escapeHTML(text){
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function textWidth(text,size){
  var canvas = textWidth.canvas || (textWidth.canvas=document.createElement('canvas'));
  var ctx = canvas.getContext('2d');
  ctx.font = '900 ' + size + 'px Arial Black, Arial, sans-serif';
  return ctx.measureText(text).width;
}

function fitMessage(){
  var text = speakerInput.value.trim();
  if(!text) return;
  var words = text.split(/\s+/);
  var width = Math.max(50, display.clientWidth - 20);
  var height = Math.max(50, display.clientHeight - 16);
  var best = null;

  for(var size=190; size>=10; size--){
    var lines = [];
    var line = '';
    for(var i=0;i<words.length;i++){
      var word = words[i];
      var test = line ? line + ' ' + word : word;
      if(textWidth(test,size) <= width){
        line = test;
      }else{
        if(line) lines.push(line);
        line = word;
      }
    }
    if(line) lines.push(line);

    var fits = lines.every(function(x){ return textWidth(x,size) <= width; });
    var totalHeight = lines.length * size * .9;
    if(fits && totalHeight <= height){
      best = {size:size,lines:lines};
      break;
    }
  }

  if(!best){
    best = {size:10,lines:[text]};
  }

  messageLines.style.fontSize = best.size + 'px';
  messageLines.innerHTML = best.lines.map(function(x){
    return '<div>' + escapeHTML(x) + '</div>';
  }).join('');
}

start.addEventListener('click', startOrPause);

reset.addEventListener('click', function(){
  if(resetDuration <= 0){
    stopTimer();
    remaining = 0;
    timeOfDay = false;
    messageVisible = false;
    message.style.display = 'none';
    timer.style.display = 'block';
    status.textContent = 'READY';
    render();
    return;
  }
  stopTimer();
  remaining = resetDuration;
  timeOfDay = false;
  messageVisible = false;
  message.style.display = 'none';
  timer.style.display = 'block';
  status.textContent = 'READY';
  render();
});

minus1.addEventListener('click', function(){ adjust(-60); });
minus30.addEventListener('click', function(){ adjust(-30); });
plus30.addEventListener('click', function(){ adjust(30); });
plus1.addEventListener('click', function(){ adjust(60); });

document.querySelectorAll('.preset').forEach(function(button){
  button.addEventListener('click', function(){
    setDuration(Number(button.getAttribute('data-min')) * 60);
  });
});

timeOfDayButton.addEventListener('click', function(){
  stopTimer();
  timeOfDay = true;
  messageVisible = false;
  message.style.display = 'none';
  timer.style.display = 'block';
  status.textContent = 'TIME OF DAY';
  render();
});

showButton.addEventListener('click', function(){
  if(!speakerInput.value.trim()) return;
  messageVisible = true;
  timer.style.display = 'none';
  message.style.display = 'flex';
  fitMessage();
  status.textContent = 'MESSAGE';
});

hideButton.addEventListener('click', function(){
  messageVisible = false;
  message.style.display = 'none';
  timer.style.display = 'block';
  status.textContent = running ? 'RUNNING' : 'READY';
  render();
});

customHeader.addEventListener('click', function(){
  var closed = customBody.style.display === 'none';
  customBody.style.display = closed ? 'block' : 'none';
  customHeader.textContent = closed ? '▼ Customize Timer' : '▶ Customize Timer';
});

customMinutes.addEventListener('change', function(){
  var n = Number(customMinutes.value);
  if(!Number.isFinite(n) || n <= 0) return;
  setDuration(n * 60);
});

bg.addEventListener('input', function(){
  document.body.style.background = bg.value;
  display.style.background = bg.value;
});

fg.addEventListener('input', function(){
  document.body.style.color = fg.value;
  timer.style.color = fg.value;
  messageLines.style.color = fg.value;
});

speakerInput.addEventListener('input', function(){
  if(messageVisible) fitMessage();
});

window.addEventListener('resize', function(){
  if(messageVisible) fitMessage();
  render();
});

/* Prevent single-finger double-tap zoom; preserve two-finger pinch zoom. */
var lastTap = 0;
document.addEventListener('touchend', function(e){
  var now = Date.now();
  if(e.changedTouches && e.changedTouches.length === 1 && now-lastTap < 320){
    e.preventDefault();
  }
  lastTap = now;
},{passive:false});

render();
})();
</script>
</body>
</html>
