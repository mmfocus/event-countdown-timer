<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>MMF TIMER</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
body{touch-action:pan-x pan-y pinch-zoom}
.app{width:100vw;height:100vh;min-height:620px;padding:18px 24px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;justify-content:space-between;align-items:flex-start;min-height:58px}
.brand{line-height:1}
.brand .mmf{font-size:27px;font-weight:900;letter-spacing:1px}
.brand .timer{font-size:20px;font-weight:900;letter-spacing:3px;margin-top:2px}
.brand .company{font-size:11px;font-weight:700;letter-spacing:2px;margin-top:6px}
.adjust{display:flex;gap:10px}
button{font:inherit;color:#fff;background:#080808;border:1px solid #555;border-radius:9px;cursor:pointer}
button:active{transform:scale(.98)}
.adjust button{min-width:76px;height:46px;font-size:17px;font-weight:800}
.display{flex:1;min-height:245px;border:1px solid #252525;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
#displayText{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px 18px;font-weight:900;line-height:.88;letter-spacing:1px;font-size:clamp(100px,18vw,230px);white-space:nowrap}
.controls{display:flex;justify-content:center;gap:16px}
.mainBtn{width:210px;height:62px;font-size:23px;font-weight:900}
.start{background:#19a84a;border-color:#19a84a}
.reset{background:#d92727;border-color:#d92727}
.presets{display:grid;grid-template-columns:repeat(10,1fr);gap:8px}
.preset{height:48px;font-size:15px;font-weight:800}
.panel{border:1px solid #333;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.panelTitle{font-size:17px;font-weight:900;width:100%}
label{font-size:13px;font-weight:700}
input[type=number]{width:105px;height:38px;background:#080808;color:#fff;border:1px solid #555;border-radius:7px;padding:7px;font-size:16px}
input[type=color]{width:55px;height:38px;background:#080808;border:1px solid #555;border-radius:7px;padding:2px}
.apply{height:40px;padding:0 16px;font-weight:800}
.messageRow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.messageRow input[type=text]{width:min(420px,45vw);height:40px;background:#080808;color:#fff;border:1px solid #555;border-radius:7px;padding:7px 10px;font-size:16px}
.msgBtn{height:40px;padding:0 18px;font-weight:800}
@media(max-width:900px){
 .app{padding:12px 14px;gap:9px}
 .adjust{gap:5px}.adjust button{min-width:62px;height:40px;font-size:14px}
 .brand .mmf{font-size:22px}.brand .timer{font-size:16px}.brand .company{font-size:9px}
 .display{min-height:230px}.presets{grid-template-columns:repeat(5,1fr)}
 .preset{height:42px;font-size:13px}.mainBtn{height:54px;width:170px}
 .panel{padding:9px}.messageRow input[type=text]{width:calc(100vw - 210px)}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">
      <div class="mmf">MMF</div>
      <div class="timer">TIMER</div>
      <div class="company">MULTIMEDIA FOCUS LLC</div>
    </div>
    <div class="adjust">
      <button onclick="MMF.adjust(-60)">−1M</button>
      <button onclick="MMF.adjust(-30)">−30s</button>
      <button onclick="MMF.adjust(30)">+30s</button>
      <button onclick="MMF.adjust(60)">+1M</button>
    </div>
  </div>

  <div class="display" id="display">
    <div id="displayText">00:00</div>
  </div>

  <div class="controls">
    <button id="startBtn" class="mainBtn start" onclick="MMF.startPause()">START</button>
    <button class="mainBtn reset" onclick="MMF.reset()">RESET</button>
  </div>

  <div class="presets">
    <button class="preset" onclick="MMF.set(5)">5 M</button>
    <button class="preset" onclick="MMF.set(10)">10 M</button>
    <button class="preset" onclick="MMF.set(15)">15 M</button>
    <button class="preset" onclick="MMF.set(20)">20 M</button>
    <button class="preset" onclick="MMF.set(30)">30 M</button>
    <button class="preset" onclick="MMF.set(40)">40 M</button>
    <button class="preset" onclick="MMF.set(50)">50 M</button>
    <button class="preset" onclick="MMF.set(60)">60 M</button>
    <button class="preset" onclick="MMF.set(90)">90 M</button>
    <button class="preset" onclick="MMF.clock()">TIME OF DAY</button>
  </div>

  <div class="panel">
    <div class="panelTitle">Customize Timer</div>
    <label>Time (minutes) <input id="customMinutes" type="number" min="0" step="1" placeholder="Minutes"></label>
    <label>Background <input id="bgColor" type="color" value="#000000"></label>
    <label>Text <input id="textColor" type="color" value="#ffffff"></label>
    <button class="apply" onclick="MMF.applyCustom()">APPLY CUSTOM SETTINGS</button>
    <div class="messageRow">
      <label>Speaker Message <input id="speakerMessage" type="text" placeholder="WRAP UP / 2 MINUTES / Q&A"></label>
      <button class="msgBtn" onclick="MMF.showMessage()">SHOW</button>
      <button class="msgBtn" onclick="MMF.hideMessage()">HIDE</button>
    </div>
  </div>
</div>

<script>
(function(){
  let remaining=0, baseDuration=0, running=false, timerId=null, messageVisible=false, clockMode=false;
  const text=()=>document.getElementById('displayText');
  const start=()=>document.getElementById('startBtn');

  function fmt(sec){
    sec=Math.max(0,Math.floor(sec));
    return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
  }
  function render(){
    if(clockMode || messageVisible)return;
    const el=text();
    el.textContent=fmt(remaining);
    el.style.whiteSpace='nowrap';
    el.style.fontSize='clamp(100px,18vw,230px)';
  }
  function setMinutes(min){
    stop();
    clockMode=false;
    messageVisible=false;
    remaining=Math.max(0,Math.round(Number(min)*60));
    baseDuration=remaining;
    render();
    start().textContent='START';
  }
  function stop(){
    running=false;
    if(timerId){clearInterval(timerId);timerId=null}
    start().textContent='START';
  }
  function startPause(){
    if(clockMode){ clock(); return; }
    if(messageVisible) hideMessage();
    if(running){stop();return}
    running=true; start().textContent='PAUSE';
    timerId=setInterval(()=>{
      if(remaining>0){
        remaining--;
        render();
      } else {
        stop();
      }
    },1000);
  }
  function reset(){
    stop();
    clockMode=false;
    messageVisible=false;
    remaining=baseDuration;
    render();
  }
  function adjust(delta){
    if(clockMode) return;
    remaining=Math.max(0,remaining+delta);
    if(remaining>0) baseDuration=remaining;
    render();
  }
  function clock(){
    stop();
    clockMode=true;
    messageVisible=false;
    const d=new Date();
    let h=d.getHours()%12||12, m=d.getMinutes();
    text().textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
    text().style.fontSize='clamp(100px,18vw,230px)';
    timerId=setInterval(()=>{
      const x=new Date(), hh=x.getHours()%12||12;
      text().textContent=String(hh).padStart(2,'0')+':'+String(x.getMinutes()).padStart(2,'0');
    },1000);
  }
  function showMessage(){
    const value=document.getElementById('speakerMessage').value.trim();
    if(!value)return;
    messageVisible=true;
    clockMode=false;
    const el=text();
    el.textContent=value;
    el.style.whiteSpace='normal';
    el.style.overflowWrap='normal';
    el.style.wordBreak='normal';
    el.style.hyphens='none';
    fitMessage();
  }
  function hideMessage(){
    messageVisible=false;
    const el=text();
    el.style.whiteSpace='nowrap';
    el.style.overflowWrap='normal';
    el.style.wordBreak='normal';
    el.style.hyphens='none';
    render();
  }
  function fitMessage(){
    const el=text();
    if(!messageVisible)return;

    // Start very large and reduce only as much as necessary.
    // Normal word wrapping is preserved: words are never split.
    let size=Math.min(190, Math.max(52, Math.min(window.innerWidth, window.innerHeight)*0.16));
    el.style.fontSize=size+'px';
    el.style.whiteSpace='normal';
    el.style.overflowWrap='normal';
    el.style.wordBreak='normal';
    el.style.hyphens='none';

    const maxW=el.clientWidth-28;
    const maxH=el.clientHeight-24;

    // Fit to both width and height, keeping whole words together.
    while(size>28 && (el.scrollWidth>maxW || el.scrollHeight>maxH)){
      size-=2;
      el.style.fontSize=size+'px';
    }
  }
  function applyCustom(){
    const mins=document.getElementById('customMinutes').value;
    document.body.style.background=document.getElementById('bgColor').value;
    document.getElementById('display').style.background=document.getElementById('bgColor').value;
    document.getElementById('displayText').style.color=document.getElementById('textColor').value;
    if(mins!=='') setMinutes(Number(mins));
  }
  window.addEventListener('resize',()=>{if(messageVisible)fitMessage()});

  window.MMF={set:setMinutes,adjust,startPause,reset,clock,showMessage,hideMessage,applyCustom};
  setMinutes(0);
})();
</script>
</body>
</html>
